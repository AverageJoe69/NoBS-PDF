[package]
name = "nobs-pdf-desktop"
version = "1.0.0"
description = "NoBS PDF desktop application"
edition = "2021"

[lib]
name = "nobs_pdf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdfdoctor = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
uuid = { version = "1", features = ["v4"] }
